<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobStory + Atlas — Portos no Mapa</title>
  <link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; width:100%; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; background:#0f172a; color:#e2e8f0; }
    #app { display:flex; flex-direction:column; height:100vh; height:100dvh; }

    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 12px; height:56px; background:#1e293b; border-bottom:1px solid #334155;
      gap:8px; z-index:100; flex-shrink:0;
    }
    .topbar-logo { font-weight:800; font-size:1.05rem; color:#38bdf8; display:flex; align-items:center; gap:6px; text-decoration:none; }
    .year-controls { display:flex; align-items:center; gap:4px; }
    .year-controls button {
      padding:6px 10px; border-radius:6px; border:1px solid #475569; background:#334155; color:#e2e8f0;
      font-size:0.8rem; cursor:pointer; transition:0.2s;
    }
    .year-controls button:hover { background:#475569; border-color:#38bdf8; }
    #yearInput {
      width:80px; padding:6px; text-align:center; font-size:1rem; font-weight:700;
      border:1px solid #475569; border-radius:6px; background:#0f172a; color:#38bdf8;
    }
    .search-box { position:relative; flex-shrink:1; min-width:100px; max-width:200px; }
    .search-box i { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:0.75rem; }
    #searchInput { width:100%; padding:6px 10px 6px 28px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#e2e8f0; font-size:0.8rem; }

    .main-area { display:flex; flex:1; overflow:hidden; position:relative; }
    #map { flex:1; height:100%; background:#0f172a; }

    #sidebar {
      width:340px; background:#1e293b; border-left:1px solid #334155;
      display:flex; flex-direction:column; overflow:hidden; transition:0.3s;
    }
    .sidebar-header {
      padding:10px 12px; border-bottom:1px solid #334155; display:flex;
      justify-content:space-between; align-items:center; font-size:0.75rem; color:#94a3b8;
    }
    .sidebar-scroll { flex:1; overflow-y:auto; padding:12px; }
    .sidebar-scroll::-webkit-scrollbar { width:6px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background:#475569; border-radius:4px; }
    .filter-label { font-size:0.65rem; text-transform:uppercase; color:#94a3b8; font-weight:600; margin-bottom:4px; display:block; }
    .filter-chips { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px; }
    .chip {
      padding:3px 10px; border-radius:12px; border:1px solid #475569; background:#334155;
      color:#cbd5e1; font-size:0.7rem; cursor:pointer; transition:0.2s; user-select:none;
    }
    .chip:hover { border-color:#38bdf8; }
    .chip.active { background:#38bdf8; color:#0f172a; border-color:#38bdf8; font-weight:600; }
    .range-row { display:flex; gap:6px; align-items:center; margin-bottom:10px; }
    .range-row input { width:70px; padding:4px 6px; border-radius:4px; border:1px solid #475569; background:#0f172a; color:#e2e8f0; text-align:center; font-size:0.75rem; }
    .section-title { font-size:0.75rem; font-weight:600; color:#38bdf8; margin:12px 0 6px; display:flex; justify-content:space-between; align-items:center; }
    .cards-list { display:flex; flex-direction:column; gap:6px; }
    .card {
      display:flex; gap:8px; padding:8px; background:#334155; border-radius:8px;
      border-left:3px solid var(--c,#38bdf8); cursor:pointer; transition:0.2s;
    }
    .card:hover { background:#475569; transform:translateX(2px); }
    .card-thumb { width:48px; height:48px; border-radius:4px; background:#1e293b; flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .card-thumb img { width:100%; height:100%; object-fit:cover; }
    .card-thumb .no-img { color:#64748b; font-size:1.2rem; }
    .card-body { flex:1; min-width:0; }
    .card-year { font-size:0.6rem; color:#38bdf8; font-weight:600; }
    .card-title { font-size:0.8rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-sub { font-size:0.65rem; color:#94a3b8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-desc { font-size:0.6rem; color:#64748b; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

    .ohm-popup .maplibregl-popup-content {
      background:#1e293b; color:#e2e8f0; border:1px solid #334155; border-radius:8px;
      padding:10px; font-family:'Segoe UI',system-ui,sans-serif; font-size:0.8rem; max-width:220px;
    }
    .ohm-popup .maplibregl-popup-tip { border-top-color:#1e293b; }
    .popup-title { font-weight:700; color:#38bdf8; font-size:0.85rem; margin-bottom:2px; }
    .popup-sub { font-size:0.7rem; color:#94a3b8; margin-bottom:6px; }
    .popup-btn {
      display:block; width:100%; padding:5px; background:#38bdf8; color:#0f172a;
      border:none; border-radius:4px; font-size:0.7rem; font-weight:600; cursor:pointer; text-align:center;
    }

    #detail-panel {
      position:absolute; top:0; right:0; bottom:0; width:360px; max-width:90vw;
      background:#1e293b; border-left:1px solid #334155;
      transform:translateX(100%); transition:0.35s cubic-bezier(0.4,0,0.2,1);
      z-index:50; display:flex; flex-direction:column; box-shadow:-8px 0 30px rgba(0,0,0,0.4);
    }
    #detail-panel.open { transform:translateX(0); }
    .detail-cover { height:140px; background:#334155; position:relative; overflow:hidden; flex-shrink:0; }
    .detail-cover img { width:100%; height:100%; object-fit:cover; }
    .detail-cover .overlay { position:absolute; inset:0; background:linear-gradient(to bottom, transparent, rgba(15,23,42,0.8)); }
    .detail-close { position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,0.5); color:#fff; border:none; cursor:pointer; }
    .detail-body { flex:1; overflow-y:auto; padding:14px; }
    .detail-badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:0.6rem; font-weight:600; background:#334155; margin-bottom:6px; }
    .detail-title { font-size:1.15rem; font-weight:700; margin-bottom:2px; }
    .detail-sub { color:#94a3b8; font-size:0.8rem; margin-bottom:10px; }
    .detail-meta { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px; }
    .meta-box { background:#334155; padding:6px 8px; border-radius:6px; }
    .meta-label { font-size:0.55rem; text-transform:uppercase; color:#94a3b8; }
    .meta-value { font-weight:600; font-size:0.8rem; }
    .detail-desc { font-size:0.85rem; line-height:1.5; color:#cbd5e1; text-align:justify; }

    .legend {
      position:absolute; bottom:12px; left:12px; background:rgba(15,23,42,0.9);
      border:1px solid #334155; border-radius:8px; padding:8px 12px; z-index:10;
      font-size:0.7rem; color:#cbd5e1; backdrop-filter:blur(4px);
    }
    .legend-item { display:flex; align-items:center; gap:6px; margin:3px 0; }
    .legend-dot { width:10px; height:10px; border-radius:50%; }

    @media (max-width:768px) {
      .topbar { height:48px; padding:4px 8px; }
      .topbar-logo { font-size:0.9rem; }
      .year-controls button { padding:4px 6px; font-size:0.65rem; }
      #yearInput { width:60px; font-size:0.85rem; }
      .search-box { max-width:140px; min-width:80px; }
      .main-area { flex-direction:column; }
      #map { height:50%; flex:none; }
      #sidebar { width:100%; height:50%; border-left:none; border-top:1px solid #334155; }
      #detail-panel { width:92%; }
      .detail-cover { height:110px; }
      .legend { bottom:auto; top:60px; left:8px; font-size:0.6rem; padding:6px 8px; }
    }
  </style>

<body>
  <div id="app">
    <header class="topbar">
      <a href="#" class="topbar-logo" id="btnReset"><i class="fa-solid fa-earth-americas"></i> GlobStory + Atlas</a>
      <div class="year-controls">
        <button onclick="app.changeYear(-100)"><i class="fa-solid fa-angles-left"></i></button>
        <button onclick="app.changeYear(-10)"><i class="fa-solid fa-angle-left"></i></button>
        <input type="number" id="yearInput" value="1500">
        <button onclick="app.changeYear(10)"><i class="fa-solid fa-angle-right"></i></button>
        <button onclick="app.changeYear(100)"><i class="fa-solid fa-angles-right"></i></button>
      </div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Buscar...">
      </div>
    </header>

    <div class="main-area">
      <div id="map"></div>

      <div class="legend">
        <div style="font-weight:600; margin-bottom:4px; color:#38bdf8;">Legenda</div>
        <div class="legend-item"><span class="legend-dot" style="background:#a78bfa;"></span> Mapa Histórico</div>
        <div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span> Porto</div>
        <div class="legend-item"><span class="legend-dot" style="background:#fbbf24;"></span> Rota Comercial</div>
      </div>

      <aside id="sidebar">
        <div class="sidebar-header">
          <span><i class="fa-solid fa-filter"></i> Filtros & Resultados</span>
          <span id="count-badge" style="background:#38bdf8; color:#0f172a; padding:2px 8px; border-radius:10px; font-size:0.65rem; font-weight:700;">0</span>
        </div>
        <div class="sidebar-scroll">
          <span class="filter-label">Período</span>
          <div class="range-row">
            <input type="number" id="inputStart" value="-2000">
            <span style="color:#94a3b8; font-size:0.7rem;">até</span>
            <input type="number" id="inputEnd" value="2026">
          </div>
          <span class="filter-label">Categoria</span>
          <div class="filter-chips" id="chips-cat"></div>
          <span class="filter-label">Tema</span>
          <div class="filter-chips" id="chips-tema"></div>
          <span class="filter-label">Cultura</span>
          <div class="filter-chips" id="chips-povo"></div>
          <div class="section-title"><span><i class="fa-solid fa-list"></i> Registros</span></div>
          <div class="cards-list" id="cardsList"></div>
        </div>
      </aside>

      <aside id="detail-panel">
        <div class="detail-cover">
          <img id="d-cover" src="" alt="" onerror="this.style.display='none'">
          <div class="overlay"></div>
          <button class="detail-close" id="btnCloseDetail"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="detail-body">
          <span class="detail-badge" id="d-badge">Categoria</span>
          <h2 class="detail-title" id="d-title">Título</h2>
          <div class="detail-sub" id="d-sub">Subtítulo</div>
          <div class="detail-meta">
            <div class="meta-box"><div class="meta-label">Ano</div><div class="meta-value" id="d-ano">-</div></div>
            <div class="meta-box"><div class="meta-label">Local</div><div class="meta-value" id="d-local">-</div></div>
            <div class="meta-box"><div class="meta-label">Coordenadas</div><div class="meta-value" id="d-coords">-</div></div>
            <div class="meta-box"><div class="meta-label">Cultura</div><div class="meta-value" id="d-povo">-</div></div>
          </div>
          <p class="detail-desc" id="d-desc">Descrição</p>
        </div>
      </aside>
    </div>
  </div>

      { nome: "Rota do Atlantico Sul", subtitulo: "Lisboa <-> Santos", tipo: "rota", pontos: [{lat: 38.7071, lon: -9.1355}, {lat: 28.9784, lon: -13.0}, {lat: -23.9608, lon: -46.3350}], cor: "#fbbf24", descricao: "Principal rota comercial entre Portugal e o Brasil colonial.", fundacao: 1500, pais: "Portugal/Brasil", continente: "Europa/America do Sul", categoria: "rota", tema: "Comercio", povo: "Portugueses e Brasileiros", coverImage: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Porto_de_Santos_aereo.jpg/400px-Porto_de_Santos_aereo.jpg" },
      { nome: "Rota do Pacifico", subtitulo: "Panama <-> Santos", tipo: "rota", pontos: [{lat: 9.3598, lon: -79.9012}, {lat: -23.9608, lon: -46.3350}], cor: "#2ecc71", descricao: "Conexao entre os oceanos Pacifico e Atlantico via Canal do Panama.", fundacao: 1914, pais: "Panama/Brasil", continente: "America Central/America do Sul", categoria: "rota", tema: "Comercio", povo: "Panamenhos e Brasileiros", coverImage: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Panama_Canal_Gatun_Locks.jpg/400px-Panama_Canal_Gatun_Locks.jpg" },
      { nome: "Rota do Mediterraneo", subtitulo: "Tanger <-> Alexandria", tipo: "rota", pontos: [{lat: 35.7595, lon: -5.8340}, {lat: 36.0, lon: 0.0}, {lat: 31.2001, lon: 29.9187}], cor: "#3498db", descricao: "Conexao entre o Atlantico e o Mar Vermelho via Mediterraneo.", fundacao: -500, pais: "Marrocos/Egito", continente: "Africa", categoria: "rota", tema: "Comercio", povo: "Fenicios, Romanos, Arabes", coverImage: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Alexandria_port.jpg/400px-Alexandria_port.jpg" }
    ];

    const app = {
      data: DADOS,
      active: { categoria: 'todos', tema: 'todos', povo: 'todos' },
      search: '',
      startYear: -2000,
      endYear: 2026,
      currentYear: 1500,
      map: null,
      popup: null,

      init() {
        this.yearInput = document.getElementById('yearInput');
        this.initMap();
        this.renderChips();
        this.applyFilters();
        this.bindEvents();
      },

      initMap() {
        const style = {
          version: 8,
          glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
          sources: {
            osm: {
              type: 'raster',
              tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
              tileSize: 256,
              attribution: 'OpenStreetMap contributors'
            }
          },
          layers: [{
            id: 'osm-base',
            type: 'raster',
            source: 'osm',
            minzoom: 0,
            maxzoom: 19
          }]
        };

        this.map = new maplibregl.Map({
          container: 'map',
          style: style,
          center: [-10, 10],
          zoom: 2.2,
          projection: 'mercator'
        });

        this.map.addControl(new maplibregl.NavigationControl(), 'top-right');
        this.map.addControl(new maplibregl.FullscreenControl(), 'top-right');

        this.map.on('load', () => {
          console.log('Mapa carregado');
          this.addAtlasLayers();
        });

        this.map.on('click', (e) => {
          const features = this.map.queryRenderedFeatures(e.point, { layers: ['atlas-points'] });
          if (features && features.length) {
            this.flyToByName(features[0].properties.nome);
          }
        });

        this.map.on('mouseenter', 'atlas-points', () => { this.map.getCanvas().style.cursor = 'pointer'; });
        this.map.on('mouseleave', 'atlas-points', () => { this.map.getCanvas().style.cursor = ''; });
      },

      addAtlasLayers() {
        const pontos = this.data.filter(d => d.tipo !== 'rota' && d.lat != null && d.lon != null);
        const geojson = {
          type: 'FeatureCollection',
          features: pontos.map(p => ({
            type: 'Feature',
            geometry: { type: 'Point', coordinates: [p.lon, p.lat] },
            properties: {
              nome: p.nome,
              subtitulo: p.subtitulo || '',
              categoria: p.categoria,
              cor: CORES[p.categoria] || '#38bdf8'
            }
          }))
        };

        this.map.addSource('atlas-source', { type: 'geojson', data: geojson });

        this.map.addLayer({
          id: 'atlas-points-glow',
          type: 'circle',
          source: 'atlas-source',
          paint: {
            'circle-radius': 16,
            'circle-color': ['get', 'cor'],
            'circle-opacity': 0.25
          }
        });

        this.map.addLayer({
          id: 'atlas-points',
          type: 'circle',
          source: 'atlas-source',
          paint: {
            'circle-radius': 7,
            'circle-color': ['get', 'cor'],
            'circle-stroke-width': 2,
            'circle-stroke-color': '#ffffff'
          }
        });

        const rotas = this.data.filter(d => d.tipo === 'rota' && d.pontos && d.pontos.length >= 2);
        rotas.forEach((rota, idx) => {
          const id = 'rota-src-' + idx;
          const coords = rota.pontos.map(p => [p.lon, p.lat]);
          this.map.addSource(id, {
            type: 'geojson',
            data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } }
          });
          this.map.addLayer({
            id: 'rota-glow-' + idx,
            type: 'line',
            source: id,
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': rota.cor || '#fbbf24', 'line-width': 5, 'line-opacity': 0.2 }
          });
          this.map.addLayer({
            id: 'rota-line-' + idx,
            type: 'line',
            source: id,
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': rota.cor || '#fbbf24', 'line-width': 2, 'line-dasharray': [4, 3], 'line-opacity': 0.9 }
          });
        });

        console.log('Camadas adicionadas:', pontos.length, 'pontos,', rotas.length, 'rotas');
      },

      updateAtlasPoints(filteredItems) {
        if (!this.map || !this.map.getSource('atlas-source')) return;
        const pontos = this.data.filter(d => d.tipo !== 'rota' && d.lat != null && d.lon != null);
        const nomesVisiveis = new Set(filteredItems.filter(d => d.tipo !== 'rota').map(d => d.nome));
        const geojson = {
          type: 'FeatureCollection',
          features: pontos.filter(p => nomesVisiveis.has(p.nome)).map(p => ({
            type: 'Feature',
            geometry: { type: 'Point', coordinates: [p.lon, p.lat] },
            properties: {
              nome: p.nome,
              subtitulo: p.subtitulo || '',
              categoria: p.categoria,
              cor: CORES[p.categoria] || '#38bdf8'
            }
          }))
        };
        this.map.getSource('atlas-source').setData(geojson);
      },

      changeYear(delta) {
        const y = parseInt(this.yearInput.value, 10) + delta;
        this.yearInput.value = y;
        this.currentYear = y;
        this.applyFilters();
      },

      flyToByName(nome) {
        const item = this.data.find(d => d.nome === nome);
        if (!item) return;
        this.flyTo(item);
      },

      flyTo(item) {
        let lat, lon, zoom;
        if (item.tipo === 'rota' && item.pontos && item.pontos.length) {
          lat = item.pontos[0].lat; lon = item.pontos[0].lon; zoom = 4.5;
        } else {
          lat = item.lat; lon = item.lon;
          zoom = item.categoria === 'mapa' ? 4 : 6;
        }
        this.map.flyTo({ center: [lon, lat], zoom: zoom, duration: 1800 });
        this.openDetail(item);

        if (this.popup) this.popup.remove();
        this.popup = new maplibregl.Popup({ offset: 15, className: 'ohm-popup' })
          .setLngLat([lon, lat])
          .setHTML(
            '<div class="popup-title">' + item.nome + '</div>' +
            '<div class="popup-sub">' + (item.subtitulo || '') + '</div>' +
            '<button class="popup-btn" onclick="app.openDetailByName(' + JSON.stringify(item.nome) + ')">Ver detalhes</button>'
          )
          .addTo(this.map);
      },

      openDetailByName(nome) {
        const item = this.data.find(d => d.nome === nome);
        if (item) this.openDetail(item);
      },

      openDetail(item) {
        const p = document.getElementById('detail-panel');
        const cover = document.getElementById('d-cover');
        cover.style.display = '';
        cover.src = item.coverImage || '';
        const badge = document.getElementById('d-badge');
        badge.textContent = LABELS[item.categoria] || item.categoria;
        badge.style.color = CORES[item.categoria] || '#38bdf8';
        document.getElementById('d-title').textContent = item.nome;
        document.getElementById('d-sub').textContent = item.subtitulo || '';
        const ano = item.fundacao < 0 ? Math.abs(item.fundacao) + ' A.C.' : item.fundacao + ' D.C.';
        document.getElementById('d-ano').textContent = ano;
        document.getElementById('d-local').textContent = (item.pais || '') + (item.continente ? ', ' + item.continente : '');
        document.getElementById('d-coords').textContent = item.tipo === 'rota' ? (item.pontos ? item.pontos.length : 0) + ' pontos' : (item.lat ? item.lat.toFixed(4) : '') + ', ' + (item.lon ? item.lon.toFixed(4) : '');
        document.getElementById('d-povo').textContent = item.povo || 'Desconhecido';
        document.getElementById('d-desc').textContent = item.descricao || '';
        p.classList.add('open');
      },

      closeDetail() {
        document.getElementById('detail-panel').classList.remove('open');
        if (this.popup) { this.popup.remove(); this.popup = null; }
      },

      renderChips() {
        const mk = (container, arr, key) => {
          const all = ['todos'].concat(Array.from(new Set(this.data.map(d => d[key]).filter(Boolean))));
          container.innerHTML = all.map(v => {
            const label = v === 'todos' ? 'Todos' : (LABELS[v] || v);
            return '<span class="chip ' + (v === 'todos' ? 'active' : '') + '" data-key="' + key + '" data-val="' + v + '">' + label + '</span>';
          }).join('');
        };
        mk(document.getElementById('chips-cat'), Array.from(new Set(this.data.map(d => d.categoria))), 'categoria');
        mk(document.getElementById('chips-tema'), Array.from(new Set(this.data.map(d => d.tema))), 'tema');
        mk(document.getElementById('chips-povo'), Array.from(new Set(this.data.map(d => d.povo))), 'povo');
      },

      applyFilters() {
        let list = this.data.filter(d => {
          const mc = this.active.categoria === 'todos' || d.categoria === this.active.categoria;
          const mt = this.active.tema === 'todos' || d.tema === this.active.tema;
          const mp = this.active.povo === 'todos' || d.povo === this.active.povo;
          const ma = d.fundacao >= this.startYear && d.fundacao <= this.endYear;
          return mc && mt && mp && ma;
        });
        if (this.search) {
          const q = this.search.toLowerCase();
          list = list.filter(d => (d.nome + d.subtitulo + d.descricao + d.povo + d.pais).toLowerCase().includes(q));
        }
        this.renderCards(list);
        document.getElementById('count-badge').textContent = list.length;
        this.updateAtlasPoints(list);
      },

      renderCards(list) {
        const container = document.getElementById('cardsList');
        if (!list.length) {
          container.innerHTML = '<div style="color:#64748b; font-size:0.75rem; text-align:center; padding:12px;">Nenhum registro encontrado</div>';
          return;
        }
        container.innerHTML = list.map(item => {
          const cor = CORES[item.categoria] || '#38bdf8';
          const ano = item.fundacao < 0 ? Math.abs(item.fundacao) + ' A.C.' : item.fundacao + ' D.C.';
          const icon = item.tipo === 'rota' ? '<i class="fa-solid fa-ship" style="margin-right:4px;"></i>' : '';
          return '<div class="card" style="--c:' + cor + '" onclick="app.flyToByName(' + JSON.stringify(item.nome) + ')">' +
            '<div class="card-thumb">' + (item.coverImage ? '<img src="' + item.coverImage + '" alt="" onerror="this.style.display='none'">' : '<i class="fa-solid fa-image no-img"></i>') + '</div>' +
            '<div class="card-body">' +
            '<div class="card-year">' + ano + '</div>' +
            '<div class="card-title">' + icon + item.nome + '</div>' +
            '<div class="card-sub">' + (item.subtitulo || '') + '</div>' +
            '<div class="card-desc">' + (item.descricao || '').substring(0, 80) + ((item.descricao || '').length > 80 ? '...' : '') + '</div>' +
            '</div></div>';
        }).join('');
      },

      bindEvents() {
        document.addEventListener('click', e => {
          const chip = e.target.closest('.chip');
          if (chip) {
            const key = chip.dataset.key;
            const val = chip.dataset.val;
            this.active[key] = val;
            chip.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            this.applyFilters();
          }
        });

        const upd = () => {
          this.startYear = parseInt(document.getElementById('inputStart').value) || -2000;
          this.endYear = parseInt(document.getElementById('inputEnd').value) || 2026;
          this.applyFilters();
        };
        document.getElementById('inputStart').addEventListener('change', upd);
        document.getElementById('inputEnd').addEventListener('change', upd);

        document.getElementById('searchInput').addEventListener('input', e => {
          this.search = e.target.value.toLowerCase();
          this.applyFilters();
        });

        this.yearInput.addEventListener('change', () => {
          const y = parseInt(this.yearInput.value, 10);
          if (!isNaN(y)) { this.currentYear = y; this.applyFilters(); }
        });

        document.getElementById('btnCloseDetail').addEventListener('click', () => this.closeDetail());
        document.addEventListener('keydown', e => { if (e.key === 'Escape') this.closeDetail(); });

        document.getElementById('btnReset').addEventListener('click', e => {
          e.preventDefault();
          this.map.flyTo({ center: [-10, 10], zoom: 2.2, duration: 1500 });
          this.closeDetail();
        });
      }
    };

    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
